    ports:
      - "${HOST_GRPC_PORT:-19093}:19093"
      - "${HOST_HTTP_PORT:-18083}:18083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19093", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      - POSTGRES_DB=${STORAGE_SERVICE_DATABASE_DBNAME:-storage_service}
      - POSTGRES_USER=${STORAGE_SERVICE_DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${STORAGE_SERVICE_DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORAGE_SERVICE_DATABASE_USER:-postgres}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}


  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-3s}

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-storage-service-pgdata}
  redisdata:
    name: ${REDIS_VOLUME:-storage-service-redisdata}
