server:
  grpc_addr: ${STORAGE_SERVICE_SERVER_GRPC_ADDR}

database:
  driver: ${STORAGE_SERVICE_DB_DRIVER}        # postgres | mysql | sqlite(空默认 postgres)
  # docker-compose 只跑 postgres;切 mysql/sqlite 时本地编辑 config.yaml 对应块
  postgres:
    host: ${STORAGE_SERVICE_DB_HOST}
    port: ${STORAGE_SERVICE_DB_PORT}
    user: ${STORAGE_SERVICE_DB_USER}
    password: ${STORAGE_SERVICE_DB_PASSWORD}
    dbname: ${STORAGE_SERVICE_DB_NAME}
    sslmode: ${STORAGE_SERVICE_DB_SSLMODE}
    # schema: ${STORAGE_SERVICE_DB_SCHEMA}    # 可选 search_path
  max_open_conns: ${STORAGE_SERVICE_DB_MAX_OPEN_CONNS}
  max_idle_conns: ${STORAGE_SERVICE_DB_MAX_IDLE_CONNS}
  conn_max_lifetime: ${STORAGE_SERVICE_DB_CONN_MAX_LIFETIME}
  # prefix for all table names; migration scripts must use matching names
  table_prefix: ${STORAGE_SERVICE_DB_TABLE_PREFIX}

redis:
  addr: ${STORAGE_SERVICE_REDIS_ADDR}
  password: ${STORAGE_SERVICE_REDIS_PASSWORD}
  db: ${STORAGE_SERVICE_REDIS_DB}

storage:
  upload_token_ttl: ${STORAGE_SERVICE_STORAGE_UPLOAD_TOKEN_TTL}
  upload_token_secret: ${STORAGE_SERVICE_STORAGE_UPLOAD_TOKEN_SECRET}
  # 10GB
  default_quota_bytes: ${STORAGE_SERVICE_STORAGE_DEFAULT_QUOTA_BYTES}
  orphan_retention: ${STORAGE_SERVICE_STORAGE_ORPHAN_RETENTION}
  # 7 days
  soft_delete_retention: ${STORAGE_SERVICE_STORAGE_SOFT_DELETE_RETENTION}
  # 30 days
  deleted_owner_retention: ${STORAGE_SERVICE_STORAGE_DELETED_OWNER_RETENTION}
  # 24h — cap on presigned download/process URL TTLs (near-permanent OSS v1
  # signatures otherwise possible; S3 rejects >7d with an opaque 500)
  presign_max_ttl: ${STORAGE_SERVICE_STORAGE_PRESIGN_MAX_TTL}
  # 1GB — hard single-file ceiling at upload issue time; larger files belong
  # on the link (object-storage reference) channel
  max_upload_bytes: ${STORAGE_SERVICE_STORAGE_MAX_UPLOAD_BYTES}

  sts:
    default_ttl: ${STORAGE_SERVICE_STS_DEFAULT_TTL}
    max_ttl: ${STORAGE_SERVICE_STS_MAX_TTL}
    # safety_margin is subtracted from a credential's remaining lifetime when
    # computing the cache TTL, so any cache hit hands out a credential with at
    # least this much usable life at the cloud provider. Without it, a cache
    # hit near expiry returns a token with seconds-to-live and in-flight
    # uploads get rejected. Must be < max_ttl (validated at startup).
    safety_margin: ${STORAGE_SERVICE_STS_SAFETY_MARGIN}
    # read_refresh_window is the read-side last line of defense: a cached
    # credential with remaining lifetime at or below this window is treated as
    # a miss and re-issued. Covers wall-clock drift and edge cases the
    # safety_margin clamp can't catch. Must be < safety_margin (validated at
    # startup).
    read_refresh_window: ${STORAGE_SERVICE_STS_READ_REFRESH_WINDOW}
    lock:
      prefix: ${STORAGE_SERVICE_STS_LOCK_PREFIX}
      ttl: ${STORAGE_SERVICE_STS_LOCK_TTL}
      tries: ${STORAGE_SERVICE_STS_LOCK_TRIES}
      wait: ${STORAGE_SERVICE_STS_LOCK_WAIT}

  cdn:
    # TTL defaults and limits for GenerateCDNURL. Per-call ttl in the request
    # is clamped to [min_ttl, max_ttl]; 0 uses default_ttl.
    default_ttl: ${STORAGE_SERVICE_CDN_DEFAULT_TTL}
    min_ttl: ${STORAGE_SERVICE_CDN_MIN_TTL}
    max_ttl: ${STORAGE_SERVICE_CDN_MAX_TTL}
    # ------------------------------------------------------------------
    # CDN console deployment checklist (per bucket with cdn: configured):
    #
    # 1. Cache key must EXCLUDE auth params so signature churn doesn't
    #    fragment the cache:
    #      - Aliyun CDN  → "过滤参数" = auth_key
    #      - CloudFront  → Cache Policy: cache key = path only
    #
    # 2. Origin forwarding — needed for response-content-disposition (i.e.
    #    GenerateCDNURL with filename, and GenerateDownloadURL). The query
    #    must reach OSS/S3 so the origin sets the Content-Disposition header:
    #      - Aliyun CDN  → "回源参数" includes response-content-disposition
    #                      (default behavior; verify in console)
    #      - CloudFront  → Origin Request Policy: forward response-content-
    #                      disposition (managed AllViewerExceptsHostHeader,
    #                      or a custom one). Without it the query is dropped
    #                      at the edge and the browser will not download.
    #
    # 3. response-content-disposition should ALSO be excluded from the cache
    #    key (different filenames over the same object shouldn't fragment
    #    the cache).
    # ------------------------------------------------------------------

  rate_limit:
    prefix: ${STORAGE_SERVICE_RATE_LIMIT_PREFIX}
    rules:
      "upload:1":            # OWNER_TYPE_USER
        - window: ${STORAGE_SERVICE_RATE_LIMIT_USER_WINDOW_1M}
          max: ${STORAGE_SERVICE_RATE_LIMIT_USER_MAX_1M}
        - window: ${STORAGE_SERVICE_RATE_LIMIT_USER_WINDOW_1H}
          max: ${STORAGE_SERVICE_RATE_LIMIT_USER_MAX_1H}
      "upload:4":            # OWNER_TYPE_BUSINESS
        - window: ${STORAGE_SERVICE_RATE_LIMIT_BIZ_WINDOW_1M}
          max: ${STORAGE_SERVICE_RATE_LIMIT_BIZ_MAX_1M}
        - window: ${STORAGE_SERVICE_RATE_LIMIT_BIZ_WINDOW_1H}
          max: ${STORAGE_SERVICE_RATE_LIMIT_BIZ_MAX_1H}

  # Providers, buckets, default_bucket and public_bucket are NO LONGER
  # configured here — they live in the DB platform tables and are managed
  # via the admin RPCs / testkit web admin pages. To import existing YAML
  # providers once:
  #   ./storage-service migrate --seed-from-config
  # (put the providers block back temporarily, run the seed, remove it).
third_party:
  gid:
    mode: ${STORAGE_SERVICE_GID_MODE}
    # config mirrors gid-service's own gidconfig.Config: snowflake settings
    # nest under `snowflake:` (see gid-service/config.example.yaml).
    config:
      snowflake:
        machine_id: ${STORAGE_SERVICE_GID_MACHINE_ID}
        start_time: ${STORAGE_SERVICE_GID_START_TIME}

log:
  level: ${STORAGE_SERVICE_LOG_LEVEL}
  format: ${STORAGE_SERVICE_LOG_FORMAT}
